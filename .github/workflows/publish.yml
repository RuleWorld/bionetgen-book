# Test the models, render the book (HTML and PDF), and publish to GitHub Pages.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Test models
        run: python tests/test_models.py

      - name: Test model behavior
        run: |
          python tests/test_science.py
          python tests/test_ch08_energy.py
          python tests/test_bngl_reference.py

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render book
        env:
          QUARTO_PYTHON: python
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
